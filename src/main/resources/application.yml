server:
  port: ${SERVER_PORT:8085}
  address: 0.0.0.0
spring:
  application:
    name: taller7-java-api
  profiles:
    default: local
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.community.dialect.PostgreSQLLegacyDialect}
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
management:
  endpoints:
    web:
      base-path: /api/demo/actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
